name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * *"
  # HACS validation checks repository metadata (topics, description, brands),
  # which changes outside a commit -- so it must be re-runnable without one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hacs/action@main
        with:
          category: plugin
          # `brands`: dropped once the home-assistant/brands PR lands.
          # `images`: dropped once a real screenshot is added to README.
          ignore: brands images

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Node 22 strips TypeScript natively, so the import-free modules are
      # tested from source with no build step.
      - run: npm run test:js
      - run: npm run build
      # The committed bundle is what HACS installs, so it must be the one these
      # sources produce -- a stale dist/ ships a card nobody can reproduce.
      - name: Committed bundle must match a fresh build
        run: git diff --exit-code dist/
