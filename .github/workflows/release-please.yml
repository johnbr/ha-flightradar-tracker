name: release-please

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag release-please creates with the workflow token triggers no other
  # workflow, so the bundle is attached here rather than by a tag workflow.
  upload-bundle:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # The tag is the cache key HACS puts in the resource URL, so a tag that
      # disagrees with package.json ships a bundle labelled as another version.
      - name: Tag must match package.json
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          PACKAGE=$(jq -r .version package.json)
          if [ "${TAG#v}" != "$PACKAGE" ]; then
            echo "Version mismatch: tag=$TAG package.json=$PACKAGE"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Committed bundle must match a fresh build
        run: git diff --exit-code dist/
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/flight-map-card.js --clobber --repo "$GITHUB_REPOSITORY"
