name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The tag is the cache key HACS puts in the resource URL, so a tag that
      # disagrees with package.json ships a bundle labelled as another version.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PACKAGE=$(jq -r .version package.json)
          if [ "$TAG" != "$PACKAGE" ]; then
            echo "Version mismatch: tag=$TAG package.json=$PACKAGE"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/flight-map-card.js
          generate_release_notes: true
