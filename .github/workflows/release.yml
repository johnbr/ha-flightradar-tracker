name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The tag is the cache key HACS puts in the resource URL, so a tag that
      # disagrees with package.json ships a bundle labelled as another version.
      - name: Tag must match package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PACKAGE=$(jq -r .version package.json)
          if [ "$TAG" != "$PACKAGE" ]; then
            echo "Version mismatch: tag=$TAG package.json=$PACKAGE"
            exit 1
          fi
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Upload to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/flight-map-card.js
          generate_release_notes: true
